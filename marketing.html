<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plum OPS — AI-Powered Claims Adjudication Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --ink:        #080c18;
  --ink2:       #1e2235;
  --ink3:       #5c6080;
  --ink4:       #9399b2;
  --plum:       #6d28d9;
  --plum-hi:    #7c3aed;
  --plum-mid:   #a78bfa;
  --plum-pale:  #ede9fe;
  --plum-ghost: rgba(109,40,217,0.08);
  --indigo:     #4f46e5;
  --emerald:    #059669;
  --amber:      #d97706;
  --surface:    #ffffff;
  --surface2:   #f8f7fc;
  --surface3:   #f2f0f9;
  --line:       rgba(0,0,0,0.07);
  --line-plum:  rgba(109,40,217,0.15);
  --sans:       'Inter', system-ui, sans-serif;
  --display:    'Bricolage Grotesque', 'Inter', sans-serif;
  --radius:     10px;
  --radius-lg:  16px;
}

/* ─── RESET ───────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--sans);background:var(--surface);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block}
a{text-decoration:none}

/* ─── LAYOUT ──────────────────────────────────────────────── */
.container{max-width:1140px;margin:0 auto;padding:0 40px}
.section{padding:104px 0}
.section-sm{padding:72px 0}

/* ─── TYPE ────────────────────────────────────────────────── */
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--plum);margin-bottom:18px;
}
.eyebrow-line{width:20px;height:1.5px;background:var(--plum);border-radius:2px}
.h1{font-family:var(--display);font-size:clamp(44px,6.5vw,84px);font-weight:800;line-height:1.0;letter-spacing:-2.5px;color:white}
.h2{font-family:var(--display);font-size:clamp(30px,4vw,50px);font-weight:800;line-height:1.08;letter-spacing:-1.5px;color:var(--ink)}
.h2-light{color:white}
.h2 em,.h2-light em{font-style:normal;color:var(--plum-mid)}
.lead{font-size:clamp(15px,1.5vw,18px);line-height:1.7;color:var(--ink3)}
.lead-light{color:rgba(255,255,255,0.5)}

/* ─── ANIMATIONS ──────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.4)}50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes count-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim-1{animation:fadeUp .55s .05s both}
.anim-2{animation:fadeUp .55s .15s both}
.anim-3{animation:fadeUp .55s .25s both}
.anim-4{animation:fadeUp .55s .35s both}
.anim-5{animation:fadeUp .55s .45s both}

/* ─── NAV ─────────────────────────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:66px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logomark{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#6d28d9 0%,#4f46e5 100%);
  display:flex;align-items:center;justify-content:center;
}
.nav-wordmark{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.3px}
.nav-wordmark span{color:var(--plum)}
.nav-center{display:flex;align-items:center;gap:32px;list-style:none}
.nav-center a{font-size:13.5px;font-weight:500;color:var(--ink3);transition:color .15s}
.nav-center a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-link-btn{font-size:13.5px;font-weight:600;color:var(--ink2);padding:8px 16px;border-radius:7px;transition:background .15s}
.nav-link-btn:hover{background:var(--surface3)}
.nav-cta-btn{
  font-size:13.5px;font-weight:600;color:white;
  padding:9px 20px;border-radius:7px;
  background:var(--plum);
  transition:background .15s,transform .1s;
}
.nav-cta-btn:hover{background:var(--plum-hi);transform:translateY(-1px)}

/* ─── HERO ────────────────────────────────────────────────── */
.hero{
  min-height:100vh;
  background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:120px 24px 96px;
  position:relative;overflow:hidden;
}
.hero-aurora{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 55% at 50% -5%, rgba(109,40,217,.55) 0%, transparent 58%),
    radial-gradient(ellipse 45% 35% at 10% 75%, rgba(79,70,229,.2) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 90% 80%, rgba(109,40,217,.14) 0%, transparent 55%);
}
.hero-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 20%,transparent 80%);
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px 6px 8px;border-radius:999px;
  border:1px solid rgba(167,139,250,.2);
  background:rgba(109,40,217,.18);
  color:var(--plum-mid);font-size:12px;font-weight:600;letter-spacing:.6px;
  margin-bottom:36px;position:relative;
}
.hero-badge-live{
  display:flex;align-items:center;gap:5px;
  background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.25);
  color:#4ade80;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.8px;
}
.hero-badge-live span{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse-ring 2s infinite}
.hero h1{position:relative;margin-bottom:28px}
.hero h1 .grad{
  background:linear-gradient(120deg,#c4b5fd 0%,#a5b4fc 40%,#6ee7b7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{
  font-size:clamp(15px,1.8vw,19px);font-weight:400;
  color:rgba(255,255,255,.48);max-width:580px;
  margin-bottom:52px;position:relative;line-height:1.7;
}
.hero-actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  position:relative;margin-bottom:88px;
}
.btn-hero-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:white;color:var(--ink);
  padding:14px 28px;border-radius:8px;
  font-size:14.5px;font-weight:700;
  transition:transform .12s,box-shadow .12s;
}
.btn-hero-primary:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(255,255,255,.15)}
.btn-hero-secondary{
  display:inline-flex;align-items:center;gap:8px;
  color:rgba(255,255,255,.65);
  padding:14px 28px;border-radius:8px;
  font-size:14.5px;font-weight:500;
  border:1px solid rgba(255,255,255,.14);
  transition:border-color .15s,color .15s;
}
.btn-hero-secondary:hover{border-color:rgba(255,255,255,.35);color:white}
.hero-kpi-bar{
  display:flex;align-items:stretch;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(8px);
  position:relative;
}
.kpi-item{padding:28px 44px;text-align:center;flex:1}
.kpi-item+.kpi-item{border-left:1px solid rgba(255,255,255,.07)}
.kpi-val{font-family:var(--display);font-size:36px;font-weight:800;color:white;line-height:1;margin-bottom:5px}
.kpi-val span{color:var(--plum-mid);font-size:28px}
.kpi-label{font-size:12px;color:rgba(255,255,255,.38);font-weight:500;letter-spacing:.2px}

/* ─── TRUST BAR ───────────────────────────────────────────── */
.trust-bar{
  padding:28px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.trust-inner{display:flex;align-items:center;gap:48px;justify-content:center;flex-wrap:wrap}
.trust-label{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink4);white-space:nowrap}
.trust-divider{width:1px;height:22px;background:var(--line);flex-shrink:0}
.trust-logos{display:flex;align-items:center;gap:36px;flex-wrap:wrap;justify-content:center}
.trust-logo{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--ink3);
  padding:6px 14px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface2);
}

/* ─── PROBLEM ─────────────────────────────────────────────── */
.problem-section{background:var(--surface2)}
.problem-header{max-width:620px;margin-bottom:64px}
.problem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.problem-card{background:white;padding:36px 40px;transition:background .2s}
.problem-card:hover{background:var(--plum-ghost)}
.problem-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:var(--surface3)}
.problem-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:9px}
.problem-body{font-size:13.5px;color:var(--ink3);line-height:1.65}
.problem-cost{
  display:inline-flex;align-items:center;gap:5px;margin-top:14px;
  padding:3px 10px;border-radius:5px;
  background:#fef2f2;color:#b91c1c;
  font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
}

/* ─── HOW IT WORKS ────────────────────────────────────────── */
.how-section{background:white}
.how-layout{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.how-text .lead{margin-bottom:28px}
.how-proof{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;border-radius:10px;
  border:1px solid var(--line-plum);background:var(--plum-ghost);
  margin-top:32px;
}
.how-proof-icon{width:36px;height:36px;flex-shrink:0;border-radius:8px;background:var(--plum);display:flex;align-items:center;justify-content:center}
.how-proof-text{font-size:13px;color:var(--ink2);line-height:1.5}
.how-proof-text strong{font-weight:700;display:block;margin-bottom:2px}

.pipeline-card{
  background:var(--ink);border-radius:var(--radius-lg);padding:32px;
  position:relative;overflow:hidden;
}
.pipeline-card-glow{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 0%, rgba(109,40,217,.4) 0%, transparent 60%);
}
.pipeline-title{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:24px;position:relative}
.pipe-list{display:flex;flex-direction:column;gap:0;position:relative}
.pipe-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;position:relative}
.pipe-row:not(:last-child)::after{
  content:'';position:absolute;left:15px;top:44px;bottom:-2px;
  width:1px;background:linear-gradient(to bottom,rgba(109,40,217,.4),rgba(109,40,217,.12));
}
.pipe-dot{
  width:30px;height:30px;flex-shrink:0;border-radius:50%;
  border:1.5px solid rgba(109,40,217,.5);
  background:rgba(109,40,217,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--plum-mid);
  position:relative;
}
.pipe-info{flex:1}
.pipe-name{font-size:13px;font-weight:700;color:white;margin-bottom:3px}
.pipe-desc{font-size:11.5px;color:rgba(255,255,255,.38);line-height:1.5}
.pipe-pill{
  display:inline-block;margin-top:5px;padding:2px 8px;border-radius:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  background:rgba(109,40,217,.25);color:var(--plum-mid);
}

/* ─── CAPABILITIES ────────────────────────────────────────── */
.cap-section{background:var(--surface2)}
.cap-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:56px}
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cap-card{
  background:white;border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:28px;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.cap-card:hover{border-color:var(--line-plum);transform:translateY(-2px);box-shadow:0 8px 32px rgba(109,40,217,.08)}
.cap-icon-wrap{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.cap-icon-wrap.purple{background:#ede9fe}
.cap-icon-wrap.indigo{background:#e0e7ff}
.cap-icon-wrap.emerald{background:#d1fae5}
.cap-icon-wrap.amber{background:#fef3c7}
.cap-icon-wrap.rose{background:#ffe4e6}
.cap-icon-wrap.sky{background:#e0f2fe}
.cap-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
.cap-body{font-size:13px;color:var(--ink3);line-height:1.65}

/* ─── METRICS ─────────────────────────────────────────────── */
.metrics-section{
  background:var(--ink);
  position:relative;overflow:hidden;
}
.metrics-aurora{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 60% at 50% 110%, rgba(109,40,217,.3) 0%, transparent 60%);
}
.metrics-layout{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;position:relative}
.metrics-text .lead-light{margin-top:16px;margin-bottom:36px}
.metric-highlights{display:flex;flex-direction:column;gap:16px}
.mh-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:9px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.03);
}
.mh-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.mh-bar.purple{background:var(--plum-mid)}
.mh-bar.indigo{background:#818cf8}
.mh-bar.emerald{background:#34d399}
.mh-bar.amber{background:#fbbf24}
.mh-val{font-family:var(--display);font-size:26px;font-weight:800;color:white;line-height:1;margin-right:2px}
.mh-unit{font-size:16px;font-weight:700;color:var(--plum-mid)}
.mh-label{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.4);margin-top:3px}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-lg);overflow:hidden}
.metric-cell{padding:28px 24px;background:rgba(255,255,255,.02)}
.metric-cell:hover{background:rgba(109,40,217,.15)}
.mc-val{font-family:var(--display);font-size:40px;font-weight:800;color:white;line-height:1;margin-bottom:7px}
.mc-val span{font-size:26px;color:var(--plum-mid)}
.mc-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:3px}
.mc-note{font-size:11.5px;color:rgba(255,255,255,.25)}

/* ─── TRANSFORM (BEFORE/AFTER) ────────────────────────────── */
.transform-section{background:white}
.transform-header{text-align:center;margin-bottom:56px}
.transform-header .section-sub{margin:0 auto;text-align:center}
.transform-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.t-col{border-radius:var(--radius-lg);padding:36px}
.t-col.before{background:var(--surface2);border:1px solid var(--line)}
.t-col.after{background:var(--ink)}
.t-head{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid}
.t-col.before .t-head{border-color:var(--line)}
.t-col.after .t-head{border-color:rgba(255,255,255,.08)}
.t-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:5px;
}
.before-badge{background:#fef2f2;color:#b91c1c}
.after-badge{background:rgba(74,222,128,.12);color:#4ade80}
.t-title{font-size:14.5px;font-weight:700}
.t-col.before .t-title{color:var(--ink2)}
.t-col.after .t-title{color:white}
.t-list{list-style:none;display:flex;flex-direction:column;gap:11px}
.t-list li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.55}
.t-col.before .t-list li{color:var(--ink3)}
.t-col.after .t-list li{color:rgba(255,255,255,.5)}
.t-x{color:#ef4444;flex-shrink:0;font-weight:700;margin-top:1px}
.t-check{color:#4ade80;flex-shrink:0;font-weight:700;margin-top:1px}

/* ─── QUOTE ───────────────────────────────────────────────── */
.quote-section{background:var(--surface2)}
.quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px}
.quote-card{
  background:white;border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px;
  position:relative;
}
.quote-mark{
  font-family:Georgia,serif;font-size:52px;line-height:.8;
  color:var(--plum-pale);font-weight:700;margin-bottom:8px;display:block;
}
.quote-text{font-size:14px;color:var(--ink2);line-height:1.7;font-style:italic;margin-bottom:24px}
.quote-author{display:flex;align-items:center;gap:10px}
.quote-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:white;
}
.qa-purple{background:var(--plum)}
.qa-indigo{background:var(--indigo)}
.qa-emerald{background:var(--emerald)}
.quote-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.quote-role{font-size:11.5px;color:var(--ink4)}
.quote-stars{color:#f59e0b;font-size:13px;margin-bottom:14px;letter-spacing:1px}

/* ─── INTEGRATIONS ────────────────────────────────────────── */
.integrations-section{background:white;padding:64px 0}
.int-inner{display:flex;align-items:center;gap:48px;flex-wrap:wrap;justify-content:center}
.int-label{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink4);white-space:nowrap}
.int-sep{width:1px;height:24px;background:var(--line);flex-shrink:0}
.int-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.int-chip{
  display:flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);font-size:13px;font-weight:500;color:var(--ink2);
  transition:border-color .15s,background .15s;
}
.int-chip:hover{border-color:var(--line-plum);background:var(--plum-ghost)}
.int-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0}

/* ─── CTA ─────────────────────────────────────────────────── */
.cta-section{
  padding:120px 0;
  background:linear-gradient(140deg,#2e1065 0%,#1e1b4b 40%,#080c18 100%);
  position:relative;overflow:hidden;text-align:center;
}
.cta-glow{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 60% at 50% 50%, rgba(109,40,217,.28) 0%, transparent 65%);
}
.cta-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--plum-mid);margin-bottom:24px;position:relative;
}
.cta-section h2{position:relative;font-family:var(--display);font-size:clamp(32px,5vw,60px);font-weight:800;color:white;line-height:1.08;letter-spacing:-1.5px;margin-bottom:20px}
.cta-section p{position:relative;font-size:17px;color:rgba(255,255,255,.45);max-width:480px;margin:0 auto 44px;line-height:1.65}
.cta-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative}
.btn-cta-white{
  background:white;color:var(--ink);
  padding:15px 32px;border-radius:8px;font-size:15px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .12s,box-shadow .12s;
}
